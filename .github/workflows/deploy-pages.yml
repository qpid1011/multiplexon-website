name: Deploy MultiplexON Lab Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage clean public site bundle
        run: |
          mkdir -p _site/data
          cp index.html professor.html 404.html CNAME .nojekyll robots.txt sitemap.xml llms.txt _redirects _site/
          cp -R css js assets member_1 _site/
          for f in site_meta.json research.json members.json publications.json news.json documents.json gallery.json recruiting.json; do
            cp "data/$f" "_site/data/$f"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
